<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Word Families">
<meta name="theme-color" content="#EEF1EC">
<title>Word families</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1EC; --card:#FFFFFF; --ink:#1B2430; --quiet:#6B7684;
    --onset:#5B3FD6; --yes:#1E7A55; --yesbg:#E6F2EC; --no:#B23A3A; --nobg:#F7E9E9;
    --star:#C98A0E; --line:#DDE2DC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);height:100%}
  body{font-family:"Andika","Century Gothic",-apple-system,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;max-width:560px;margin:0 auto;
    display:flex;flex-direction:column;min-height:100%;
    padding:max(10px,env(safe-area-inset-top)) 14px 0}
  button{font-family:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);cursor:pointer}
  button:active{transform:scale(.97)}
  svg{width:1em;height:1em;display:block}
  .hide{display:none !important}

  /* mode tabs */
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;flex:none}
  .tabs3{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tabs3 .tab{flex-direction:column;gap:3px;font-size:14px}
  .tabs3 .tab svg{font-size:22px}
  a.tab{text-decoration:none}
  .tab{min-height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;
       font-size:19px;color:var(--quiet);border-color:transparent;background:#E2E6E0}
  .tab svg{font-size:25px}
  .tab.on{background:var(--ink);color:#fff}

  main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-start}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 14px 20px;text-align:center}
  .clock{font-size:26px;color:var(--quiet);min-height:32px;letter-spacing:1px}
  #word{font-size:clamp(48px,15.5vw,80px);line-height:1.15;letter-spacing:1px;cursor:pointer;word-break:break-word}
  #word .on{color:var(--onset)}
  .speak{width:66px;height:66px;border-radius:50%;margin:12px auto 0;display:flex;align-items:center;
         justify-content:center;font-size:30px;color:var(--onset);border-color:#D9D2F7;background:#F1EEFC}
  #dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--line)}
  .dot.done{background:var(--yes)} .dot.miss{background:var(--no)}
  .dot.here{outline:2px solid var(--ink);outline-offset:3px}

  .judge{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .judge button{min-height:98px;border-radius:20px;display:flex;flex-direction:column;align-items:center;
                justify-content:center;gap:4px;font-size:15px}
  .judge svg{font-size:42px}
  #got{color:var(--yes);border-color:var(--yes);background:var(--yesbg)}
  #miss{color:var(--no);border-color:var(--no);background:var(--nobg)}

  #score{font-size:26px;color:var(--star);text-align:center;margin-top:14px}

  /* picker screens */
  .grp{font-size:15px;color:var(--quiet);margin:18px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .fam{min-height:58px;min-width:74px;font-size:22px;border-radius:16px;padding:0 16px}
  .fam.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .bigchip{width:100%;min-height:74px;font-size:26px;border-radius:18px;margin-bottom:10px}
  .bigchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grades{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 10px}
  .grade{min-height:78px;border-radius:18px;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:3px;padding:0 8px;color:var(--quiet)}
  .gbig{font-size:19px;color:var(--ink)}
  .gsm{font-size:12px;line-height:1.3}
  .grade.on{background:var(--onset);border-color:var(--onset);color:#E6E1FB}
  .grade.on .gbig{color:#fff}
  .kinds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:4px 0 2px}
  .kind{min-height:84px;border-radius:18px;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:2px;padding:0 4px;color:var(--quiet)}
  .kbig{font-size:24px;color:var(--onset)}
  .ksm{font-size:12px}
  .kind.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .kind.on .kbig{color:#fff}
  .scroll{overflow-y:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}

  /* timed ready + result */
  .huge{font-size:44px;line-height:1.2}
  .go{width:100%;min-height:104px;border-radius:22px;margin-top:14px;font-size:26px;color:var(--yes);
      border-color:var(--yes);background:var(--yesbg);display:flex;align-items:center;justify-content:center;gap:12px}
  .go svg{font-size:34px}
  .note{font-size:17px;color:var(--quiet);margin-top:8px;line-height:1.5}

  /* fixed bottom nav, identical in both modes */
  .nav{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;
       padding:12px 0 max(12px,env(safe-area-inset-bottom));background:var(--paper);
       position:sticky;bottom:0}
  .nav button{min-height:76px;border-radius:18px;display:flex;flex-direction:column;align-items:center;
              justify-content:center;gap:3px;font-size:14px;color:var(--quiet)}
  .nav svg{font-size:28px;color:var(--ink)}
  .nav button.on{background:var(--ink);color:#fff} .nav button.on svg{color:#fff}

  #blast{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .spark{position:absolute;left:50%;top:45%;font-size:34px;color:var(--star);
    animation:fly 1900ms cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes fly{
    0%{transform:translate(-50%,-50%) scale(.2) rotate(0deg);opacity:0}
    12%{opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.5) rotate(var(--rot));opacity:0}
  }
  @media (prefers-reduced-motion:reduce){button:active{transform:none}.spark{animation-duration:1ms;opacity:0}}
</style>
</head>
<body>

<div class="tabs tabs3">
  <button class="tab on" id="tabPractice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 015.5 3H10v16H5.5A2.5 2.5 0 003 21.5zM21 5.5A2.5 2.5 0 0018.5 3H14v16h4.5a2.5 2.5 0 012.5 2.5z"/></svg>
    Practice</button>
  <button class="tab" id="tabTimed">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9M9.5 2h5M18.5 7.5l1.5-1.5"/></svg>
    Timed</button>
  <a class="tab" href="story.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20H4v-4zM14 6l4 4"/></svg>
    Story</a>
</div>

<main>
  <!-- PLAY -->
  <section id="sPlay">
    <div class="card">
      <div class="clock" id="clock"></div>
      <div id="word">&nbsp;</div>
      <button class="speak" id="speak" aria-label="Hear the word">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor" stroke="none"/><path d="M16 9.2a4.2 4.2 0 010 5.6M18.7 6.6a7.8 7.8 0 010 10.8"/></svg>
      </button>
      <div id="dots"></div>
    </div>
    <div class="judge">
      <button id="miss">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        not yet</button>
      <button id="got">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l5.5 5.5L20 6"/></svg>
        got it</button>
    </div>
    <div id="score">&#9733; 0</div>
  </section>

  <!-- FAMILY PICKER (practice) -->
  <section id="sPick" class="scroll hide"></section>

  <!-- GROUP PICKER (timed) -->
  <section id="sGroups" class="scroll hide"></section>

  <!-- READY / RESULT (timed) -->
  <section id="sReady" class="hide">
    <div class="card">
      <div class="huge" id="rBig"></div>
      <div class="note" id="rNote"></div>
    </div>
    <button class="go" id="go">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5l13 7.5-13 7.5z"/></svg>
      <span id="goLabel">Start</span>
    </button>
  </section>
</main>

<nav class="nav">
  <button id="navPick">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
    <span id="navPickLabel">sounds</span></button>
  <button id="navAgain">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9M20 3.5V8h-4.5"/></svg>
    <span>again</span></button>
</nav>

<div id="blast"></div>

<script>
var GROUPS=[
 {g:"short a",f:[
  {r:"at",w:["cat","bat","hat","mat","sat","rat","fat","pat","chat","flat","that","splat"]},
  {r:"an",w:["can","man","pan","ran","van","fan","tan","plan","than","scan","span"]},
  {r:"ap",w:["cap","map","nap","tap","lap","gap","rap","sap","clap","snap","trap"]},
  {r:"ag",w:["bag","tag","rag","wag","sag","nag","flag","drag","brag","snag"]},
  {r:"am",w:["ham","jam","ram","yam","clam","slam","swam","gram","sham"]},
  {r:"ad",w:["bad","dad","had","mad","sad","lad","pad","glad"]},
  {r:"and",w:["band","hand","land","sand","stand","grand","brand","strand"]},
  {r:"ack",w:["back","pack","sack","tack","rack","jack","black","snack","track","stack","crack"]}]},
 {g:"short e",f:[
  {r:"en",w:["hen","pen","ten","den","men","when","then","glen"]},
  {r:"et",w:["bet","get","jet","let","net","pet","set","wet","met","vet"]},
  {r:"ed",w:["bed","fed","led","red","wed","shed","sled","fled","bled"]},
  {r:"ell",w:["bell","fell","tell","sell","well","yell","shell","smell","spell","swell"]},
  {r:"est",w:["best","nest","rest","test","vest","west","pest","chest","quest"]},
  {r:"eg",w:["beg","leg","peg","keg"]}]},
 {g:"short i",f:[
  {r:"ig",w:["big","dig","pig","wig","fig","jig","twig","zig"]},
  {r:"in",w:["bin","fin","pin","win","tin","chin","grin","skin","spin","thin","shin"]},
  {r:"it",w:["bit","fit","hit","sit","pit","kit","lit","quit","spit","split"]},
  {r:"ip",w:["dip","lip","rip","tip","zip","hip","sip","chip","ship","trip","drip","flip","skip"]},
  {r:"ick",w:["kick","lick","pick","sick","tick","brick","chick","stick","trick","quick","thick","click"]},
  {r:"ill",w:["bill","fill","hill","pill","will","mill","chill","drill","skill","spill","still","grill"]},
  {r:"ing",w:["king","ring","sing","wing","thing","spring","bring","cling","sting","swing","string"]}]},
 {g:"short o",f:[
  {r:"op",w:["hop","mop","top","pop","cop","shop","stop","chop","drop","crop","flop","prop"]},
  {r:"ot",w:["cot","dot","got","hot","not","pot","lot","spot","shot","slot","trot"]},
  {r:"og",w:["dog","fog","hog","jog","log","frog","clog","smog"]},
  {r:"ock",w:["lock","rock","sock","dock","clock","block","knock","shock","flock","stock"]},
  {r:"ob",w:["job","rob","mob","sob","cob","blob","snob","glob"]}]},
 {g:"short u",f:[
  {r:"ug",w:["bug","dug","hug","jug","mug","rug","tug","plug","slug","snug","chug"]},
  {r:"un",w:["bun","fun","run","sun","spun","stun","shun"]},
  {r:"ut",w:["but","cut","hut","nut","gut","jut","shut","strut"]},
  {r:"ump",w:["bump","dump","jump","lump","pump","stump","grump","plump","slump","thump"]},
  {r:"ub",w:["cub","rub","tub","hub","sub","club","grub","stub","scrub"]},
  {r:"uck",w:["buck","duck","luck","tuck","stuck","truck","cluck","pluck","struck"]}]},
 {g:"long a",f:[
  {r:"ake",w:["cake","lake","make","take","bake","rake","wake","snake","shake","brake","flake","stake","quake"]},
  {r:"ay",w:["day","may","play","say","way","stay","hay","lay","pay","ray","bay","gray","tray","clay","stray"]},
  {r:"ame",w:["came","game","name","same","tame","blame","flame","frame","shame"]},
  {r:"ail",w:["mail","nail","sail","tail","fail","jail","rail","pail","trail","snail"]},
  {r:"ate",w:["gate","late","date","hate","mate","plate","skate","state","crate"]},
  {r:"ain",w:["main","rain","train","brain","chain","plain","gain","pain","stain"]}]},
 {g:"long e",f:[
  {r:"eat",w:["beat","heat","meat","neat","seat","treat","wheat","cheat"]},
  {r:"ee",w:["see","bee","free","tree","three","knee","flee","glee"]},
  {r:"eed",w:["feed","need","seed","weed","speed","bleed","freed","greed"]},
  {r:"eep",w:["keep","deep","jeep","peep","sleep","sweep","sheep","steep","creep"]}]},
 {g:"long i",f:[
  {r:"ight",w:["light","night","right","sight","might","bright","fight","tight","flight"]},
  {r:"ide",w:["ride","side","hide","wide","tide","bride","slide","glide","pride"]},
  {r:"ine",w:["line","mine","nine","pine","vine","dine","fine","shine","spine"]},
  {r:"ike",w:["bike","like","hike","spike","strike"]},
  {r:"ime",w:["time","lime","dime","chime","slime","crime","prime"]}]},
 {g:"long o",f:[
  {r:"oat",w:["boat","coat","goat","float","throat","moat"]},
  {r:"ow",w:["low","mow","row","show","slow","snow","grow","blow","flow","glow","throw"]},
  {r:"ole",w:["hole","mole","pole","role","stole","whole"]},
  {r:"one",w:["bone","cone","tone","zone","stone","phone"]}]},
 {g:"other sounds",f:[
  {r:"ook",w:["book","look","took","cook","hook","shook","brook","crook"]},
  {r:"all",w:["ball","call","fall","tall","wall","small","hall","mall","stall"]},
  {r:"ink",w:["pink","sink","wink","link","think","drink","blink","stink","brink"]},
  {r:"out",w:["shout","scout","spout","trout","sprout"]}]}
];

var ONSETS=[
 {g:"two-letter sounds",f:[
  {o:"ch",w:["chat","chin","chip","chop","chest","chick","check","chill","chomp","chunk","chug","champ"]},
  {o:"sh",w:["shed","ship","shop","shot","shut","shell","shin","shack","shelf","shine","shape","shade"]},
  {o:"th",w:["that","them","then","this","thin","thick","thump","thing","think","thud","thank"]},
  {o:"wh",w:["when","whip","whiz","whisk","white","whale","wheel","wheat","while"]}]},
 {g:"beginning blends",f:[
  {o:"bl",w:["black","blank","blend","blink","block","blue","blow","blast","blob","bless"]},
  {o:"br",w:["bring","brick","brush","brave","bread","brain","brown","broom","brag","brake"]},
  {o:"cl",w:["clap","class","clip","clock","cloud","clean","close","club","cliff","clay"]},
  {o:"cr",w:["crab","crack","crib","crop","cross","crust","cream","crown","crash","crisp"]},
  {o:"dr",w:["drag","dress","drink","drip","drop","drum","dream","drive","drank"]},
  {o:"fl",w:["flag","flap","flat","flip","flock","fluff","float","flame","flash","fly"]},
  {o:"fr",w:["frog","from","front","fresh","frost","fruit","frame","free","frill","fry"]},
  {o:"gl",w:["glad","glass","glue","glow","globe","glove","glide","glint"]},
  {o:"gr",w:["grab","grass","green","grin","grip","grow","grand","gray","grill","grape"]},
  {o:"pl",w:["plan","plant","play","plum","plus","plot","plug","plate","plain","plank"]},
  {o:"pr",w:["press","print","prize","proud","prop","prank","price","pride","prom"]},
  {o:"sk",w:["skip","skin","skit","skunk","skate","skill","sky","skid"]},
  {o:"sl",w:["slam","sled","sleep","slide","slip","slow","slug","sling","slot","slap"]},
  {o:"sm",w:["small","smell","smile","smoke","smash","smart","smock","smug"]},
  {o:"sn",w:["snack","snail","snake","snap","sniff","snow","snug","snip"]},
  {o:"sp",w:["spin","spot","spell","spend","speak","spill","sport","space","spark","spy"]},
  {o:"st",w:["stop","star","step","stick","still","stone","storm","stand","sting","stamp"]},
  {o:"sw",w:["swim","swing","sweet","swan","sweep","swept","swell","switch"]},
  {o:"tr",w:["train","trap","tree","trick","trip","truck","trust","track","treat","trade"]},
  {o:"tw",w:["twin","twig","twist","twelve","twenty","twice"]}]}
];

var GROUPS2=[
 {g:"r sounds",f:[
  {r:"ar",w:["car","far","jar","tar","bar","star","scar","char"]},
  {r:"ark",w:["park","dark","bark","mark","shark","spark","lark"]},
  {r:"art",w:["part","cart","start","smart","chart","dart","tart"]},
  {r:"orn",w:["corn","born","horn","thorn","worn","morn"]},
  {r:"ort",w:["fort","sort","short","sport","port","snort"]},
  {r:"irt",w:["dirt","shirt","skirt","flirt","squirt"]}]},
 {g:"vowel teams",f:[
  {r:"aw",w:["saw","paw","law","jaw","raw","claw","draw","straw","thaw"]},
  {r:"awn",w:["yawn","lawn","dawn","fawn","drawn","prawn"]},
  {r:"oil",w:["boil","soil","coil","foil","spoil","broil","toil"]},
  {r:"oy",w:["boy","toy","joy","soy","ploy"]},
  {r:"ew",w:["new","few","chew","crew","drew","grew","blew","flew","stew","threw","screw"]},
  {r:"own",w:["down","town","brown","clown","crown","gown","frown"]},
  {r:"ound",w:["found","round","sound","pound","ground","hound","mound","bound"]}]},
 {g:"tricky endings",f:[
  {r:"tch",w:["catch","match","patch","hatch","pitch","ditch","witch","switch","batch"]},
  {r:"dge",w:["badge","ledge","judge","fudge","bridge","dodge","hedge","nudge"]}]}
];

var SIGHT=[
 {g:"sight words",lvl:1,f:[
  {s:"1st grade",w:["the","a","and","are","to","is","his","as","has","was","we","she","he","be","me","I","you","they","or","for","of","have","from","by","my","do","one"]}]},
 {g:"harder sight words",lvl:2,f:[
  {s:"2nd grade",w:["always","around","because","been","before","best","both","buy","call","cold","does","don't","fast","first","five","found","gave","goes","green","its","made","many","off","or","pull","read","right","sing","sit","sleep","tell","their","these","those","upon","us","use","very","wash","which","why","wish","work","would","write","your"]},
  {s:"3rd grade",w:["about","better","bring","carry","clean","cut","done","draw","drink","eight","fall","far","full","got","grow","hold","hot","hurt","if","keep","kind","laugh","light","long","much","myself","never","only","own","pick","seven","shall","show","six","small","start","ten","today","together","try","warm"]}]}
];

// -ight is a grade 2 pattern; it lives with the other tricky endings
var MOVE={"ight":"tricky endings","out":"vowel teams"};
GROUPS.forEach(function(G){
  G.f=G.f.filter(function(f){
    if(!MOVE[f.r]) return true;
    for(var i=0;i<GROUPS2.length;i++){ if(GROUPS2[i].g===MOVE[f.r]){ GROUPS2[i].f.push(f); break; } }
    return false;
  });
});
GROUPS=GROUPS.concat(GROUPS2);
var G2NAMES={"beginning blends":1,"r sounds":1,"vowel teams":1,"tricky endings":1};
GROUPS.forEach(function(G){G.lvl=G2NAMES[G.g]?2:1;G.f.forEach(function(f){f.t="end";f.k=f.r;f.lab="-"+f.r;});});
ONSETS.forEach(function(G){G.lvl=G2NAMES[G.g]?2:1;G.f.forEach(function(f){f.t="start";f.k=f.o;f.lab=f.o+"-";});});
SIGHT.forEach(function(G){G.f.forEach(function(f){f.t="sight";f.k="";f.lab=f.s;f.lvl=G.lvl;});});
var ALL=GROUPS.concat(ONSETS).concat(SIGHT);

var FAMS=[];
ALL.forEach(function(G,gi){G.f.forEach(function(f){f.idx=FAMS.length;f.gi=gi;FAMS.push(f);});});
function famKey(f){ return f.t+":"+f.lab; }
function mk(f,w){ return {w:w, cut:(f.t==="end"? w.length-f.k.length : f.k.length), state:0, key:famKey(f)}; }

// how often each word has been shown, so fresh words come up more often.
// loaded lazily: store is defined further down the file
var seen=null;
function seenAll(){ if(seen===null) seen=store.get("seen",{}); return seen; }
function seenCount(c){ var m=seenAll()[c.key]; return (m&&m[c.w])||0; }
function markSeen(c){ var s=seenAll(), m=s[c.key]||(s[c.key]={}); m[c.w]=(m[c.w]||0)+1; store.set("seen",s); }

// weighted draw without replacement: each extra viewing quarters a word's odds
function drawWeighted(cands,n){
  var pool=cands.slice(), out=[], min=Infinity, i;
  pool.forEach(function(c){ c.sc=seenCount(c); if(c.sc<min) min=c.sc; });
  while(out.length<n && pool.length){
    var tot=0;
    pool.forEach(function(c){ c.wt=Math.pow(0.25, c.sc-min); tot+=c.wt; });
    var r=Math.random()*tot;
    for(i=0;i<pool.length;i++){ r-=pool[i].wt; if(r<=0) break; }
    if(i>=pool.length) i=pool.length-1;
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}

var SIMPLE=/^(ch|sh|th|wh|qu)$/;
// grade 1 = one consonant (or a simple digraph) at the front, and a short word
function wlvl(f,w){
  if(f.t==="sight") return f.lvl;
  if(f.t==="start") return (SIMPLE.test(f.k) && w.length<=5) ? 1 : 2;
  var on=w.slice(0, w.length-f.k.length);
  if(w.length<=4) return 1;                                   // short words are fair game
  return ((on.length<=1 || SIMPLE.test(on)) && w.length<=5) ? 1 : 2;
}
ALL.forEach(function(G){ G.f.forEach(function(f){
  f.w1=f.w.filter(function(w){ return wlvl(f,w)===1; });
  f.w2=f.w.filter(function(w){ return wlvl(f,w)===2; });
});});
// grade 2 decks take every harder word first, then top up with review words
function deckWords(f,n){
  var mkw=function(w){ return mk(f,w); };
  if(grade===1) return shuffle(drawWeighted(f.w1.map(mkw),n));
  var out=drawWeighted(f.w2.map(mkw),n);
  if(out.length<n) out=out.concat(drawWeighted(f.w1.map(mkw),n-out.length));
  return shuffle(out);
}
function poolFor(G,n){
  var hard=[], easy=[];
  G.f.forEach(function(f){
    if(grade===2) f.w2.forEach(function(w){ hard.push(mk(f,w)); });
    f.w1.forEach(function(w){ easy.push(mk(f,w)); });
  });
  var out=drawWeighted(hard,n);
  if(out.length<n) out=out.concat(drawWeighted(easy,n-out.length));
  return shuffle(out);
}
function famOK(f){ return (grade===2 || (ALL[f.gi].lvl===1 && f.w1.length>=3)); }
function grpOK(G){ return grade===2 || G.lvl===1; }

var store={
  get:function(k,d){try{var v=localStorage.getItem("wf_"+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem("wf_"+k,JSON.stringify(v));}catch(e){}}
};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var E=function(id){return document.getElementById(id);};

var ROUND=12;
var mode="practice", screen="play";
var grade=store.get("grade",1);
var fi=Math.min(store.get("fam",0),FAMS.length-1);
var gi=store.get("grp",0);
var deck=[], pos=0, misses=0, score=store.get("score",0);
var t0=0, ticker=null;
var famChips=[], grpChips=[];

/* ---------- pickers ---------- */
var kind=store.get("kind","end");
var paneEnd=document.createElement("div"), paneStart=document.createElement("div"), paneSight=document.createElement("div");
var kindRow=document.createElement("div"); kindRow.className="kinds";
[["end","-at","endings"],["start","ch-","beginnings"],["sight","the","sight words"]].forEach(function(p){
  var b=document.createElement("button"); b.className="kind";
  b.innerHTML='<span class="kbig">'+p[1]+'</span><span class="ksm">'+p[2]+'</span>';
  b.onclick=function(){ kind=p[0]; store.set("kind",kind); paintKinds(); };
  kindRow.appendChild(b); b.dataset.k=p[0];
});
function paintKinds(){
  Array.prototype.forEach.call(kindRow.children,function(b){ b.className=(b.dataset.k===kind)?"kind on":"kind"; });
  paneEnd.className = kind==="end"?"":"hide";
  paneStart.className = kind==="start"?"":"hide";
  paneSight.className = kind==="sight"?"":"hide";
}
E("sPick").appendChild(gradeRow("p")); E("sPick").appendChild(kindRow); E("sPick").appendChild(paneEnd); E("sPick").appendChild(paneStart); E("sPick").appendChild(paneSight);

function fillPane(sets, pane){
  sets.forEach(function(G){
    var h=document.createElement("div"); h.className="grp"; h.textContent=G.g; pane.appendChild(h);
    var row=document.createElement("div"); row.className="chips";
    G.f.forEach(function(f){
      var b=document.createElement("button"); b.className="fam"; b.textContent=f.lab;
      b.onclick=function(){ fi=f.idx; store.set("fam",fi); newPractice(); show("play"); };
      famChips[f.idx]=b; row.appendChild(b);
    });
    pane.appendChild(row);
  });
}
function fillPanes(){
  paneEnd.innerHTML=""; paneStart.innerHTML=""; paneSight.innerHTML=""; famChips=[];
  fillPane(GROUPS.filter(grpOK),paneEnd);
  fillPane(ONSETS.filter(grpOK),paneStart);
  fillPane(SIGHT.filter(grpOK),paneSight);
  paintKinds();
}
fillPanes();

function fillGroups(){
  E("sGroups").innerHTML=""; grpChips=[];
  E("sGroups").appendChild(gradeRow("g"));
  ALL.forEach(function(G,i){
    if(!grpOK(G)) return;
    var b=document.createElement("button"); b.className="bigchip"; b.textContent=G.g;
    b.onclick=function(){ gi=i; store.set("grp",gi); showReady(); show("ready"); };
    b.dataset.i=i; grpChips.push(b); E("sGroups").appendChild(b);
  });
}

function gradeRow(tag){
  var row=document.createElement("div"); row.className="grades";
  [[1,"1st grade","short words, one letter in front"],[2,"2nd grade","blends, r sounds, vowel teams"]].forEach(function(p){
    var b=document.createElement("button"); b.className="grade";
    b.innerHTML='<span class="gbig">'+p[1]+'</span><span class="gsm">'+p[2]+'</span>';
    b.dataset.g=p[0]; b.dataset.tag=tag;
    b.onclick=function(){ setGrade(p[0]); };
    row.appendChild(b);
  });
  return row;
}
function paintGrades(){
  Array.prototype.forEach.call(document.querySelectorAll(".grade"),function(b){
    b.className=(+b.dataset.g===grade)?"grade on":"grade";
  });
}
function setGrade(g){
  if(g===grade) return;
  grade=g; store.set("grade",grade);
  fillPanes(); fillGroups(); paintGrades();
  if(!famOK(FAMS[fi])){ for(var i=0;i<FAMS.length;i++){ if(famOK(FAMS[i])){ fi=i; break; } } store.set("fam",fi); }
  if(!grpOK(ALL[gi])){ gi=0; store.set("grp",gi); }
  if(mode==="practice"){ newPractice(); } else { showReady(); }
  render();
}
fillGroups();

/* ---------- speech ---------- */
function say(){
  try{
    if(!window.speechSynthesis||!deck[pos])return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(deck[pos].w);
    u.rate=0.7;u.pitch=1.1;u.lang="en-US";
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}

/* ---------- rounds ---------- */
function newPractice(){
  var f=FAMS[fi];
  deck=deckWords(f,ROUND);
  pos=0; render();
}
function newTimed(){
  deck=poolFor(ALL[gi],ROUND); pos=0; misses=0;
  t0=Date.now(); clearInterval(ticker); ticker=setInterval(tick,100); tick(); render();
}
function tick(){ E("clock").textContent=((Date.now()-t0)/1000).toFixed(1)+"s"; }

function render(){
  var c=deck[pos];
  if(c){
    E("word").innerHTML='<span class="on">'+c.w.slice(0,c.cut)+"</span>"+c.w.slice(c.cut);
  }
  famChips.forEach(function(b,i){ if(b) b.className=(i===fi)?"fam on":"fam"; });
  grpChips.forEach(function(b){ b.className=(+b.dataset.i===gi)?"bigchip on":"bigchip"; });
  paintGrades();
  var d=E("dots"); d.innerHTML="";
  deck.forEach(function(c,i){
    var el=document.createElement("div");
    el.className="dot"+(c.state===1?" done":c.state===2?" miss":"")+(i===pos?" here":"");
    d.appendChild(el);
  });
  E("score").innerHTML="&#9733; "+score; store.set("score",score);
}

function advance(){
  render();
  setTimeout(function(){
    if(pos>=deck.length-1){ finish(); return; }
    pos++; render();
  }, mode==="timed"?200:450);
}

function finish(){
  if(mode==="practice"){ newPractice(); return; }
  clearInterval(ticker);
  var secs=(Date.now()-t0)/1000, key="best_"+gi+"_g"+grade, best=store.get(key,null);
  var perfect=(misses===0), record=false;
  if(perfect&&(best===null||secs<best)){ record=true; store.set(key,Math.round(secs*10)/10); }
  E("rBig").textContent=secs.toFixed(1)+"s";
  if(record){ E("rNote").textContent="new record \u2014 every word right!"; blast(); }
  else if(perfect){ E("rNote").textContent="all right! record is "+best.toFixed(1)+"s"; }
  else { E("rNote").textContent=misses+(misses===1?" word":" words")+" to practice"; }
  E("goLabel").textContent="Go again";
  show("ready");
}

function blast(){
  var host=E("blast"); host.innerHTML="";
  for(var i=0;i<64;i++){
    var s=document.createElement("div"); s.className="spark"; s.textContent="\u2605";
    var a=Math.random()*Math.PI*2, d=140+Math.random()*460;
    s.style.setProperty("--dx",Math.cos(a)*d+"px");
    s.style.setProperty("--dy",Math.sin(a)*d+"px");
    s.style.setProperty("--rot",(Math.random()*720-360)+"deg");
    s.style.fontSize=(20+Math.random()*40)+"px";
    s.style.animationDelay=(Math.random()*350)+"ms";
    host.appendChild(s);
  }
  setTimeout(function(){host.innerHTML="";},2600);
}

function showReady(){
  E("rBig").textContent=ALL[gi].g;
  var b=store.get("best_"+gi+"_g"+grade,null);
  E("rNote").textContent=b===null?"read 12 words as fast as you can":"best so far: "+b.toFixed(1)+"s";
  E("goLabel").textContent="Start";
  render();
}

/* ---------- screens ---------- */
function show(s){
  screen=s; hush();
  if(s!=="play"){ clearInterval(ticker); }
  E("sPlay").className = s==="play"?"":"hide";
  E("sPick").className = s==="pick"?"scroll":"scroll hide";
  E("sGroups").className = s==="groups"?"scroll":"scroll hide";
  E("sReady").className = s==="ready"?"":"hide";
  E("navPick").className = (s==="pick"||s==="groups")?"on":"";
  E("navPickLabel").textContent = mode==="timed"?"groups":"sounds";
  E("clock").className = (mode==="timed"&&s==="play")?"clock":"clock hide";
  E("score").className = mode==="timed"?"hide":"";
  window.scrollTo(0,0);
}

function setMode(m){
  hush(); clearInterval(ticker); mode=m;
  E("tabPractice").className = m==="practice"?"tab on":"tab";
  E("tabTimed").className = m==="timed"?"tab on":"tab";
  if(m==="practice"){ newPractice(); show("play"); }
  else { showReady(); show("ready"); }
}

/* ---------- handlers ---------- */
E("got").onclick=function(){
  hush(); if(!deck[pos]||screen!=="play"||deck[pos].state!==0)return;
  markSeen(deck[pos]); deck[pos].state=1; if(mode==="practice") score++;
  advance();
};
E("miss").onclick=function(){
  hush(); if(!deck[pos]||screen!=="play"||deck[pos].state!==0)return;
  markSeen(deck[pos]); deck[pos].state=2;
  if(mode==="practice"){ if(score>0)score--; } else { misses++; }
  advance();
};
E("go").onclick=function(){ newTimed(); show("play"); };
E("speak").onclick=say;
E("word").onclick=say;
E("navPick").onclick=function(){
  if(screen==="pick"||screen==="groups"){ show(mode==="practice"?"play":"ready"); }
  else { show(mode==="practice"?"pick":"groups"); }
};
E("navAgain").onclick=function(){
  hush();
  if(mode==="practice"){ newPractice(); show("play"); }
  else if(screen==="play"){ newTimed(); }
  else { showReady(); show("ready"); }
};
E("tabPractice").onclick=function(){ if(mode!=="practice") setMode("practice"); };
E("tabTimed").onclick=function(){ if(mode!=="timed") setMode("timed"); };

setMode(location.hash==="#timed"?"timed":"practice");

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
