<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Word Families">

<title>Make a story</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1EC; --card:#FFFFFF; --ink:#1B2430; --quiet:#6B7684; --line:#DDE2DC;
    --name:#1E7A55; --namebg:#E6F2EC; --desc:#5B3FD6; --descbg:#F1EEFC;
    --doing:#B06A0E; --doingbg:#FAF0DF; --star:#C98A0E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);height:100%}
  body{font-family:"Andika","Century Gothic",-apple-system,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;max-width:560px;margin:0 auto;
    display:flex;flex-direction:column;min-height:100%;
    padding:max(10px,env(safe-area-inset-top)) 14px 0}
  button{font-family:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);cursor:pointer}
  button:active{transform:scale(.97)}
  svg{width:1em;height:1em;display:block}
  .hide{display:none !important}

  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;flex:none}
  .tab{min-height:62px;border-radius:16px;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:3px;font-size:14px;color:var(--quiet);border-color:transparent;background:#E2E6E0;
       text-decoration:none}
  .tab svg{font-size:22px}
  .tab.on{background:var(--ink);color:#fff}

  main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 16px}
  h1{font-size:25px;margin:0 0 12px;line-height:1.3}
  .line{font-size:22px;line-height:1.85;margin:0 0 6px}
  .w{cursor:pointer}
  .blank{display:inline-block;min-width:74px;border-bottom:3px solid var(--line);text-align:center;
         vertical-align:baseline;color:var(--quiet)}
  .blank.name{border-color:var(--name)} .blank.desc{border-color:var(--desc)} .blank.doing{border-color:var(--doing)}
  .blank.now{background:#FFF6D9;border-radius:6px}
  .fill{padding:0 4px;border-radius:6px;cursor:pointer}
  .fill.name{background:var(--namebg);color:var(--name)}
  .fill.desc{background:var(--descbg);color:var(--desc)}
  .fill.doing{background:var(--doingbg);color:var(--doing)}

  .traywrap{margin-top:14px}
  .traytop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .prompt{font-size:16px;color:var(--quiet)}
  .more{min-height:44px;border-radius:12px;padding:0 12px;font-size:14px;color:var(--quiet);
        display:flex;align-items:center;gap:6px}
  .tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  .tile{min-height:62px;border-radius:15px;font-size:20px;padding:0 4px}
  .tile.name{background:var(--namebg);border-color:#BFDDD0;color:var(--name)}
  .tile.desc{background:var(--descbg);border-color:#D4CBF5;color:var(--desc)}
  .tile.doing{background:var(--doingbg);border-color:#EBD6AB;color:var(--doing)}

  .done{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .done button{min-height:72px;border-radius:18px;display:flex;flex-direction:column;align-items:center;
               justify-content:center;gap:3px;font-size:14px;color:var(--quiet)}
  .done svg{font-size:26px;color:var(--ink)}
  .nav{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;
       padding:12px 0 max(12px,env(safe-area-inset-bottom));background:var(--paper);position:sticky;bottom:0}
  .nav button{min-height:76px;border-radius:18px;display:flex;flex-direction:column;align-items:center;
              justify-content:center;gap:3px;font-size:14px;color:var(--quiet)}
  .nav svg{font-size:28px;color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;
         padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.on{opacity:1}
  @media print{
    .tabs,.traywrap,.nav,.done,.toast{display:none !important}
    body{padding:0} .card{border:none} .line{font-size:20px}
    .fill{background:none !important;color:#000 !important}
  }
  @media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>

<div class="tabs" id="tabs">
  <a class="tab" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 015.5 3H10v16H5.5A2.5 2.5 0 003 21.5zM21 5.5A2.5 2.5 0 0018.5 3H14v16h4.5a2.5 2.5 0 012.5 2.5z"/></svg>
    Practice</a>
  <a class="tab" href="index.html#timed">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9M9.5 2h5M18.5 7.5l1.5-1.5"/></svg>

  <button class="tab on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20H4v-4zM14 6l4 4"/></svg>
    Story</button>
</div>

<main>
  <div class="card">
    <h1 id="title"></h1>
    <div id="body"></div>
  </div>

  <div class="traywrap" id="traywrap">
    <div class="traytop">
      <div class="prompt" id="prompt"></div>
      <button class="more" id="more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9M20 3.5V8h-4.5"/></svg>
        more</button>
    </div>
    <div class="tray" id="tray"></div>
  </div>

  <div class="done hide" id="done">
    <button id="share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8.5 6.5L12 3l3.5 3.5M5 13v6.5A1.5 1.5 0 006.5 21h11a1.5 1.5 0 001.5-1.5V13"/></svg>
      send it</button>
    <button id="print">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6M7 19H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2M7 15h10v6H7z"/></svg>
      print</button>
  </div>
</main>

<nav class="nav">
  <button id="newStory">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16M4 12h16M4 18.5h9"/><circle cx="18.5" cy="18.5" r="3.2"/><path d="M18.5 17v3M17 18.5h3"/></svg>
    new story</button>
  <button id="read">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor" stroke="none"/><path d="M16 9.2a4.2 4.2 0 010 5.6M18.7 6.6a7.8 7.8 0 010 10.8"/></svg>
    read it</button>
</nav>

<div class="toast" id="toast"></div>

 {t:"Fall",s:["The leaves went red and gold.","They fell all over the {PLACE}.","I jumped in a {ADJ} pile.","My {ANIMAL} {PAST} in too.","We raked it up again."]},
 {t:"The Snowman",s:["We made a snowman in the {PLACE}.","We gave it a {ADJ} {THING}.","My {ANIMAL} {PAST} around it.","The sun came out.","Now it is gone."]},
 {t:"Spring",s:["The snow went away.","Green bits came up in the {PLACE}.","A {ADJ} {ANIMAL} came back.","We planted seeds for {FOOD}.","Then it rained all week."]},
 {t:"Summer",s:["School was out at last.","We went to the {PLACE} every day.","We ate {FOOD} with my {ANIMAL}.","It was hot and {ADJ}.","I did not want it to end."]},
 {t:"The Parade",s:["There was a parade on our {PLACE}.","It was loud and {ADJ}.","My {PERSON} put me up high.","They threw {FOOD} to us.","I got three!"]},
 {t:"Fireworks",s:["We sat in the {PLACE} at night.","The sky went {ADJ} and bright.","My {ANIMAL} hid under a {THING}.","It was loud but good.","We stayed up late."]},
 {t:"The First Day",s:["It was the first day of school.","I had a new {THING}.","My belly felt {ADJ}.","My {PERSON} walked me to the {PLACE}.","By lunch I was fine."]},
 {t:"The Last Day",s:["It was the last day of school.","We had {FOOD} in class.","I packed my {THING}.","We ran to the {PLACE}.","It was a {ADJ} day.","Now it is summer!"]},
 {t:"A Rainy Week",s:["It rained all week.","We stayed in the {PLACE}.","I read a {ADJ} book.","My {ANIMAL} slept on my {THING}.","Then the sun came out."]},
 {t:"The Long Drive",s:["We drove for a long time.","I looked out at the {PLACE}.","I saw a {ADJ} {ANIMAL}.","We stopped for {FOOD}.","I slept the rest of the way."]},
 {t:"My Silly Dream",s:["I had a {ADJ} dream.","A {ANIMAL} sat on my {THING}.","It ate all my {FOOD}.","Then it {PAST} out the door.","I woke up and laughed."]},
 {t:"The Loose Tooth",s:["My tooth was loose all week.","It felt {ADJ}.","I ate a {FOOD} and it came out!","I showed my {PERSON}.","I put it under my {THING}.","In the morning I had a coin."]},
 {t:"The Big Sneeze",s:["I felt a sneeze come on.","It was very {ADJ}.","It blew my {THING} off the {PLACE}!","My {ANIMAL} ran away.","My {PERSON} said bless you."]},
 {t:"Hiccups",s:["I got the hiccups at the {PLACE}.","They would not stop.","I drank some {FOOD}.","My {PERSON} said boo!","They were gone, but I felt {ADJ}."]},
 {t:"The Night Light",s:["My room was dark and {ADJ}.","I could not sleep.","My {PERSON} gave me a {THING}.","Now my room glows.","My {ANIMAL} sleeps by me too."]},
 {t:"Stars",s:["We lay in the {PLACE} at night.","We brought a {THING} to lie on.","The stars were {ADJ} and bright.","My {PERSON} showed me one.","We made a wish.","Then we went in."]},
 {t:"The Monster Under the Bed",s:["I thought a monster was under my bed.","I was {ADJ} all night.","I looked with a {THING}.","It was just my {ANIMAL}!","It {PAST} out and slept by me."]},
 {t:"Bedtime",s:["My {PERSON} says it is bed time.","I want one more book.","My {ANIMAL} is on my {THING}.","We read a {ADJ} one.","Then I fall asleep fast."]},
 {t:"The Pillow Fort",s:["I made a fort on my bed.","I used my {ADJ} {THING}.","My {ANIMAL} {PAST} in.","We stayed in all day.","My {PERSON} brought us {FOOD}."]},
 {t:"When I Grow Up",s:["When I grow up I will be {ADJ}.","I will live by the {PLACE}.","I will have a {ANIMAL} of my own.","I will eat {FOOD} every day.","And I will still visit my {PERSON}."]}
];

var BANK={
 ANIMAL:["cat","dog","pig","hen","frog","duck","fox","bug","rat","bat","ant","cub","pup","hog","goat","chick","crab","snail","snake","bird","fish","shark","moth","toad","mole","lamb","deer","mouse"],
 PERSON:["mom","dad","gran","pop","pal","kid","chef","king","twin","cop","nurse","coach"],
 THING:["hat","box","sled","mug","cup","sock","bed","bag","cap","pot","pan","net","drum","bell","ball","kite","book","rug","lamp","clock","truck","van","ship","bike","stick","rock","coat","broom","brush","flag","jar","key","map","rope","cart","tent"],
 FOOD:["jam","ham","cake","plum","bun","egg","corn","chips","snack","milk","soup","fig","nut","pie","bread","cheese","pizza","popcorn","toast","grapes"],
 PLACE:["barn","pond","shop","hill","park","yard","camp","lake","farm","path","den","cave","deck","hall","gym","pool","beach","woods","porch","garden","dock","creek","field","street","store","attic","closet","kitchen"],
 ADJ:["big","sad","mad","glad","hot","wet","red","tall","small","quick","thick","bright","neat","sweet","green","brown","black","white","funny","little","loud","soft","silly","wild","brave","fast","slow","long","dark","shiny","messy","sleepy","fluffy","grumpy"],
 PAST:["ran","hopped","jumped","slid","crept","zoomed","rolled","raced","marched","stomped","swam","flew","crawled","skipped","danced","spun","splashed","dashed","wiggled","tiptoed"]
};
</script>
<script>
(function(){
var E=function(id){return document.getElementById(id);};
var NOUNS={ANIMAL:1,PERSON:1,THING:1,FOOD:1,PLACE:1};
var JOB={ANIMAL:"name",PERSON:"name",THING:"name",FOOD:"name",PLACE:"name",ADJ:"desc",PAST:"doing"};
var ASK={ANIMAL:"pick an animal",PERSON:"pick a person",THING:"pick a thing",FOOD:"pick a food",
         PLACE:"pick a place",ADJ:"pick a describing word",PAST:"pick a doing word"};
var TYPES=["ANIMAL","PERSON","THING","FOOD","PLACE","ADJ","PAST"];

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

// words he has already been judged on in the flashcards get shown first
var practiced={};
try{
  var raw=localStorage.getItem("wf_seen");
  if(raw){ var seen=JSON.parse(raw);
    for(var k in seen) for(var w in seen[k]) practiced[w]=1; }
}catch(e){}

/* ---- a frame becomes a list of blanks; nouns bind, describing and doing words don't ---- */
var frame=null, blanks=[], pick=[], cur=0, tray=[], readonly=false;

function parseFrame(fi){
  frame=FRAMES[fi]; frame.i=fi; blanks=[]; pick=[];
  var seenType={};
  var lines=[frame.t].concat(frame.s);
  frame.parts=lines.map(function(line){
    var out=[], last=0, m, re=/\{(\w+)\}/g;
    while((m=re.exec(line))){
      if(m.index>last) out.push({txt:line.slice(last,m.index)});
      var ty=m[1], id;
      if(NOUNS[ty]){
        if(seenType[ty]===undefined){ seenType[ty]=blanks.length; blanks.push(ty); pick.push(null); }
        id=seenType[ty];
      } else { id=blanks.length; blanks.push(ty); pick.push(null); }
      out.push({slot:id});
      last=m.index+m[0].length;
    }
    if(last<line.length) out.push({txt:line.slice(last)});
    return out;
  });
  cur=0;
}

function draw(type,n){
  var all=BANK[type].slice();
  var known=shuffle(all.filter(function(w){return practiced[w];}));
  var rest=shuffle(all.filter(function(w){return !practiced[w];}));
  return shuffle(known.concat(rest).slice(0,n));
}

function render(){
  var fixArticles=function(h){
    return h.replace(/\bA (<span[^>]*>)([aeiouAEIOU])/g,"An $1$2")
            .replace(/\ba (<span[^>]*>)([aeiouAEIOU])/g,"an $1$2");
  };
  var html=function(parts){
    return fixArticles(parts.map(function(p){
      if(p.txt!==undefined) return p.txt.replace(/</g,"&lt;");
      var ty=blanks[p.slot], job=JOB[ty], w=pick[p.slot];
      if(w) return '<span class="fill '+job+' w" data-slot="'+p.slot+'">'+w+'</span>';
      return '<span class="blank '+job+(p.slot===cur?" now":"")+'" data-slot="'+p.slot+'">&nbsp;&nbsp;&nbsp;&nbsp;</span>';
    }).join(""));
  };
  E("title").innerHTML=html(frame.parts[0]);
  E("body").innerHTML=frame.parts.slice(1).map(function(p){
    return '<p class="line">'+html(p)+'</p>';
  }).join("");

  Array.prototype.forEach.call(document.querySelectorAll("#title .w,#body .w"),function(el){
    el.onclick=function(){
      if(readonly){ say(el.textContent); return; }
      cur=+el.dataset.slot; pick[cur]=null; fillTray(); render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".blank"),function(el){
    el.onclick=function(){ cur=+el.dataset.slot; fillTray(); render(); };
  });

  var left=pick.indexOf(null);
  E("traywrap").className = (readonly||left===-1) ? "traywrap hide" : "traywrap";
  E("done").className = (left===-1) ? "done" : "done hide";
}

function fillTray(){
  if(pick[cur]!==null){ var n=pick.indexOf(null); if(n===-1) return; cur=n; }
  var ty=blanks[cur];
  if(!ty) return;
  tray=draw(ty,9);
  E("prompt").textContent=ASK[ty];
  var t=E("tray"); t.innerHTML="";
  tray.forEach(function(w){
    var b=document.createElement("button");
    b.className="tile "+JOB[ty]; b.textContent=w;
    b.onclick=function(){
      say(w);
      pick[cur]=w;
      var n=pick.indexOf(null);
      if(n!==-1){ cur=n; fillTray(); }
      render();
    };
    t.appendChild(b);
  });
}

/* ---- speech ---- */
function say(text,rate){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.rate=rate||0.75; u.pitch=1.05; u.lang="en-US";
    speechSynthesis.speak(u);
  }catch(e){}
}
function storyText(){
  return frame.parts.map(function(parts){
    return parts.map(function(p){ return p.txt!==undefined ? p.txt : (pick[p.slot]||"blank"); }).join("");
  }).join(" ");
}

/* ---- share by putting the story in the link ---- */
function encode(){
  var b=36;
  return frame.i.toString(b)+"."+pick.map(function(w,i){
    return BANK[blanks[i]].indexOf(w).toString(b);
  }).join(".");
}
function decode(code){
  var p=code.split("."), fi=parseInt(p[0],36);
  if(isNaN(fi)||!FRAMES[fi]) return false;
  parseFrame(fi);
  for(var i=0;i<blanks.length;i++){
    var idx=parseInt(p[i+1],36);
    if(isNaN(idx)||!BANK[blanks[i]][idx]) return false;
    pick[i]=BANK[blanks[i]][idx];
  }
  return true;
}
function toast(msg){
  var t=E("toast"); t.textContent=msg; t.className="toast on";
  setTimeout(function(){ t.className="toast"; },1800);
}

/* ---- actions ---- */
function newStory(){
  readonly=false;
  try{ if(history.replaceState) history.replaceState(null,"",location.pathname); }catch(e){}
  parseFrame(Math.floor(Math.random()*FRAMES.length));
  fillTray(); render(); window.scrollTo(0,0);
}
E("newStory").onclick=newStory;
E("read").onclick=function(){ say(storyText(),0.7); };
E("more").onclick=fillTray;
E("print").onclick=function(){ window.print(); };
E("share").onclick=function(){
  var url=location.origin+location.pathname+"?s="+encode();
  var title=frame.parts[0].map(function(p){return p.txt!==undefined?p.txt:pick[p.slot];}).join("");
  if(navigator.share){ navigator.share({title:title,text:"A story I made",url:url}).catch(function(){}); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ toast("link copied"); },function(){ prompt("Copy this link:",url); }); return; }
  prompt("Copy this link:",url);
};

/* ---- start ---- */
var q=(location.search.match(/[?&]s=([^&]+)/)||[])[1];
if(q && decode(decodeURIComponent(q))){
  readonly=true; render();
  E("newStory").querySelector("svg").parentNode.lastChild.textContent="make my own";
} else {
  newStory();
}
})();
</script>
</body>
</html>
